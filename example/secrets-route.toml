# bugnet-edge --role secrets settings, /etc/bugnet/secrets-route.toml (DP 8.4)
# Its one secret comes only from the environment, BUGNET_SECRETS_TOKEN

router_url = "http://127.0.0.1:8080"
tls_listen_addr = "127.0.0.1:8445"    # TLS for host, PROXY v2 first
metrics_listen_addr = "127.0.0.1:9104"  # /healthz, /readyz and /metrics
proxy_protocol_from = ["127.0.0.1/32", "::1/128"]
host = "secrets.bugnet.sh"            # required, a lowercase host name
page_dir = "/srv/bugnet/secrets-page"   # root-owned, read-only to bugnet-secrets
requests_per_minute = 60              # per client IP, 0 is no limit
max_header_bytes = "1MiB"             # a full cookie jar never breaks the page
acme_enabled = true                   # false serves host from the pair in static_dir
acme_directory = "https://acme-v02.api.letsencrypt.org/directory"
acme_dir = "/var/lib/bugnet-secrets/acme"
acme_email = ""
static_dir = ""                       # fullchain.pem and key.pem, ACME off
