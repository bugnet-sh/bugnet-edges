name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: bugnet-edges
    steps:
      - uses: actions/checkout@v7
        with:
          path: bugnet-edges
          persist-credentials: false

      # Siblings use the branch of the same name when it exists there, else main
      - name: Pick sibling branches
        id: siblings
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          pick() {
            local status=0
            git ls-remote --exit-code --heads "https://github.com/bugnet-sh/$1.git" \
              "refs/heads/$BRANCH" > /dev/null || status=$?
            if [ "$status" -eq 0 ]; then
              echo "$BRANCH"
            elif [ "$status" -eq 2 ]; then
              echo main
            else
              return "$status"
            fi
          }
          proto=$(pick bugnet-proto)
          run=$(pick bugnet-run)
          echo "bugnet-proto at $proto, bugnet-run at $run"
          echo "proto=$proto" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # go.mod replaces bugnet-proto with ../bugnet-proto
      - uses: actions/checkout@v7
        with:
          repository: bugnet-sh/bugnet-proto
          ref: ${{ steps.siblings.outputs.proto }}
          path: bugnet-proto
          persist-credentials: false

      # The egress and sshgw tests build bugnet-run from ../bugnet-run and skip without it
      - uses: actions/checkout@v7
        with:
          repository: bugnet-sh/bugnet-run
          ref: ${{ steps.siblings.outputs.run }}
          path: bugnet-run
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: bugnet-edges/go.mod
          cache-dependency-path: bugnet-edges/go.sum

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -w needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: bugnet-edges

      - name: go test
        run: go test -short -timeout 10m ./...
